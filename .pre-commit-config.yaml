# Pre-commit hooks, run with prek (https://github.com/j178/prek):
#   prek install   # once per clone
# Hooks mirror CI: cargo fmt + cargo clippy with denied warnings.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
