# niri-punto: load the uinput driver at boot.
# Installed by `niri-punto setup` (escalated step) or by hand:
#   sudo install -m 644 contrib/niri-punto.conf /etc/modules-load.d/
#   sudo modprobe uinput  # effective immediately, no reboot needed
# Without the driver /dev/uinput is a dead static node (root-only, no
# sysfs entry): no udev rule can match it and open fails, so the daemon
# cannot inject and exits on start.
uinput
