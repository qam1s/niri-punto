name: coverage
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: write
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-tarpaulin
      - name: Run tarpaulin
        run: cargo tarpaulin --locked --workspace --out Xml --output-dir /tmp/coverage | tee /tmp/coverage.txt
      - name: Build coverage.json from cobertura.xml
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python3 - <<'EOF'
          import json
          import xml.etree.ElementTree as ET
          tree = ET.parse("/tmp/coverage/cobertura.xml")
          pct = float(tree.getroot().attrib["line-rate"]) * 100.0
          value = f"{pct:.1f}".rstrip("0").rstrip(".") + "%"
          color = "yellow"
          with open("coverage.json", "w") as f:
              json.dump({"schemaVersion": 1, "label": "coverage", "message": value, "color": color}, f)
          print(f"coverage: {value}")
          EOF
      - name: Publish badge to gh-badges branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="gh-badges"
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/gh-badges
          if git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BRANCH" "$REPO" /tmp/gh-badges
          else
            mkdir -p /tmp/gh-badges
            git -C /tmp/gh-badges init -b "$BRANCH"
            git -C /tmp/gh-badges remote add origin "$REPO"
          fi
          cp coverage.json /tmp/gh-badges/coverage.json
          cd /tmp/gh-badges
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          if git ls-files --error-unmatch badge.svg >/dev/null 2>&1; then git rm -q badge.svg; fi
          if git diff --cached --quiet; then
            echo "coverage unchanged"
          else
            git commit -m "docs: update coverage data"
            git push origin "$BRANCH"
          fi
